<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IR Prohori — Security-first AI</title>
    <link rel="stylesheet" href="css/style.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    
    <!-- 🔒 Login Guard -->
    <script>
        if (!localStorage.getItem("ir_prohori_user")) {
            window.location.href = "login.html";
        }
    </script>
</head>
<body>

    <button class="hamburger-btn" id="hamburgerBtn">
        <span></span>
        <span></span>
        <span></span>
    </button>

    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="logo">
                <span class="logo-icon">🛡️</span>
                <span class="logo-text">IR Prohori</span>
            </div>
            <button class="sidebar-close-btn" id="sidebarCloseBtn">✕</button>
        </div>

        <button class="new-chat-btn" id="newChatBtn">
            <span>✏️</span> New Chat
        </button>

        <div class="sidebar-section">
            <div class="section-title">Today</div>
            <div class="chat-list" id="chatList"></div>
        </div>

        <div class="sidebar-footer">
            <div class="user-info" id="userInfo">
                <div class="user-avatar" id="userAvatar">M</div>
                <div class="user-details">
                    <div class="user-name" id="userName">Loading...</div>
                    <div class="user-tag" id="userRole">#DigitalProhori</div>
                </div>
                <button class="logout-btn" id="logoutBtn" title="Logout">⏻</button>
            </div>
        </div>
    </aside>

    <main class="main-area">

        <div class="welcome-screen" id="welcomeScreen">
            <div class="welcome-logo">🛡️</div>
            <h1 class="welcome-title">IR Prohori</h1>
            <p class="welcome-subtitle">A security-first AI assistant for digital safety</p>

            <div class="suggestion-grid">
                <div class="suggestion-card" data-query="How to report online harassment?">
                    <div class="suggestion-icon">🚨</div>
                    <div class="suggestion-text">How to report online harassment?</div>
                </div>
                <div class="suggestion-card" data-query="Cyber law in Bangladesh?">
                    <div class="suggestion-icon">⚖️</div>
                    <div class="suggestion-text">Cyber law in Bangladesh?</div>
                </div>
                <div class="suggestion-card" data-query="হেল্পলাইন নাম্বার কী কী?">
                    <div class="suggestion-icon">📞</div>
                    <div class="suggestion-text">হেল্পলাইন নাম্বার কী কী?</div>
                </div>
                <div class="suggestion-card" data-query="What is illegal online?">
                    <div class="suggestion-icon">🚫</div>
                    <div class="suggestion-text">What is illegal online?</div>
                </div>
            </div>
        </div>

        <div class="chat-container" id="chatContainer"></div>

        <div class="input-wrapper">
            <div class="input-box">
                <textarea
                    id="messageInput"
                    placeholder="Message IR Prohori..."
                    rows="1"
                ></textarea>
                <button class="send-btn" id="sendBtn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                        <path d="M5 12h14M12 5l7 7-7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </button>
            </div>
            <div class="input-footer">IR Prohori by Iftiur Hossen Riyad | #DigitalProhori</div>
        </div>
    </main>

    <script src="js/memory.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
