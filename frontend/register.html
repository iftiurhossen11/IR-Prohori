<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register — IR Prohori</title>
    <link rel="stylesheet" href="css/login.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body>
    <div class="login-wrapper">
        <div class="login-card">
            <div class="login-logo">🛡️</div>
            <h1 class="login-title">Create Account</h1>
            <p class="login-subtitle">Join IR Prohori for a safer digital space</p>

            <form id="registerForm" class="login-form">
                <div class="input-group">
                    <label for="nameInput">Full Name</label>
                    <input type="text" id="nameInput" placeholder="Your full name" required />
                </div>

                <div class="input-group">
                    <label for="emailInput">Email</label>
                    <input type="email" id="emailInput" placeholder="you@example.com" required />
                </div>

                <div class="input-group">
                    <label for="roleSelect">Role</label>
                    <select id="roleSelect">
                        <option value="Student">Student</option>
                        <option value="Ambassador">Ambassador</option>
                        <option value="Admin">Admin</option>
                    </select>
                </div>

                <div class="input-group">
                    <label for="passwordInput">Password</label>
                    <input type="password" id="passwordInput" placeholder="Create a password (min 6 characters)" required minlength="6" />
                </div>

                <div class="input-group">
                    <label for="confirmInput">Confirm Password</label>
                    <input type="password" id="confirmInput" placeholder="Re-enter your password" required minlength="6" />
                </div>

                <div class="input-group">
                    <label for="securityQuestion">Security Question (for password reset)</label>
                    <select id="securityQuestion">
                        <option value="What is your mother's name?">What is your mother's name?</option>
                        <option value="What is your favorite color?">What is your favorite color?</option>
                        <option value="What is your birth city?">What is your birth city?</option>
                        <option value="What is your pet's name?">What is your pet's name?</option>
                    </select>
                </div>

                <div class="input-group">
                    <label for="securityAnswer">Your Answer</label>
                    <input type="text" id="securityAnswer" placeholder="Your answer" required />
                </div>

                <button type="submit" class="login-btn">Register</button>
            </form>

            <div class="login-links">
                Already have an account? <a href="login.html">Sign In</a>
            </div>

            <div class="login-footer">
                <span style="color: #6a6a6a;">#DigitalProhori</span>
                <span style="color: #6a6a6a;">|</span>
                <span style="color: #6a6a6a;">Iftiur Hossen Riyad</span>
            </div>
        </div>
    </div>

    <script src="js/auth.js"></script>
    <script src="js/register.js"></script>
</body>
</html>
