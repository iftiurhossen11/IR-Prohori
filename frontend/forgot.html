<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset Password — IR Prohori</title>
    <link rel="stylesheet" href="css/login.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body>
    <div class="login-wrapper">
        <div class="login-card">
            <div class="login-logo">🔑</div>
            <h1 class="login-title">Reset Password</h1>
            <p class="login-subtitle">Answer your security question to reset</p>

            <form id="forgotForm" class="login-form">
                <div class="input-group">
                    <label for="emailInput">Email</label>
                    <input type="email" id="emailInput" placeholder="your registered email" required />
                </div>

                <div class="input-group" id="questionGroup" style="display: none;">
                    <label for="questionDisplay">Security Question</label>
                    <input type="text" id="questionDisplay" readonly />
                </div>

                <div class="input-group" id="answerGroup" style="display: none;">
                    <label for="answerInput">Your Answer</label>
                    <input type="text" id="answerInput" placeholder="Answer the security question" />
                </div>

                <div class="input-group" id="newPasswordGroup" style="display: none;">
                    <label for="newPasswordInput">New Password</label>
                    <input type="password" id="newPasswordInput" placeholder="New password (min 6 characters)" minlength="6" />
                </div>

                <button type="submit" class="login-btn" id="submitBtn">Find Account</button>
            </form>

            <div class="login-links">
                <a href="login.html">Back to Sign In</a> | <a href="register.html">Register</a>
            </div>

            <div class="login-footer">
                <span style="color: #6a6a6a;">#DigitalProhori</span>
                <span style="color: #6a6a6a;">|</span>
                <span style="color: #6a6a6a;">Iftiur Hossen Riyad</span>
            </div>
        </div>
    </div>

    <script src="js/auth.js"></script>
    <script src="js/forgot.js"></script>
</body>
</html>
