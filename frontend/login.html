<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign In — IR Prohori</title>
    <link rel="stylesheet" href="css/login.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body>
    <div class="login-wrapper">
        <div class="login-card">
            <div class="login-logo">🛡️</div>
            <h1 class="login-title">Welcome to IR Prohori</h1>
            <p class="login-subtitle">Sign in to continue to your secure assistant</p>

            <form id="loginForm" class="login-form">
                <div class="input-group">
                    <label for="emailInput">Email</label>
                    <input type="email" id="emailInput" placeholder="you@example.com" required />
                </div>

                <div class="input-group">
                    <label for="passwordInput">Password</label>
                    <input type="password" id="passwordInput" placeholder="Your password" required />
                </div>

                <button type="submit" class="login-btn">Sign In</button>
            </form>

            <div class="login-links">
                <a href="forgot.html">Forgot Password?</a> | <a href="register.html">Register</a>
            </div>

            <div class="login-footer">
                <span style="color: #6a6a6a;">#DigitalProhori</span>
                <span style="color: #6a6a6a;">|</span>
                <span style="color: #6a6a6a;">Iftiur Hossen Riyad</span>
            </div>
        </div>
    </div>

    <script src="js/auth.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
